<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>키워드 QR 인쇄</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="data.js?v=20261126b"></script>
  <style>
    @page { size: A4; margin: 10mm; }
    body { margin: 0; background: #f1f5f9; font-family: "Jua", system-ui, sans-serif; color: #1f2937; }
    .bar { padding: 16px; text-align: center; }
    .bar p { margin: 4px 0; font-family: system-ui, sans-serif; font-size: 14px; color: #475569; }
    .bar button { font-family: inherit; font-size: 17px; border: 0; border-radius: 999px; padding: 9px 20px; background: #e2e8f0; color: #334155; cursor: pointer; margin: 8px 3px 0; }
    .bar button.on, .bar button.print { background: #f97316; color: #fff; }

    /* 화면에서는 A4 종이 모양으로 미리보기 */
    .page {
      width: 190mm; height: 277mm; margin: 0 auto 16px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12);
      display: grid; gap: 8mm; padding: 0; box-sizing: border-box;
    }
    .page.n1 { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
    .item {
      border-radius: 6mm; border: 2.5mm solid var(--c); box-sizing: border-box; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .item .em { font-size: 9mm; line-height: 1; }
    .item h2 { margin: 2mm 0 3mm; font-size: 16mm; line-height: 1; color: var(--c); }
    .qr { width: 62mm; height: 62mm; }
    .qr img, .qr canvas { width: 100% !important; height: 100% !important; display: block; }
    .item .say { font-size: 5mm; margin-top: 4mm; }
    .n1 .item { border-width: 4mm; border-radius: 10mm; }
    .n1 .em { font-size: 22mm; } .n1 h2 { font-size: 40mm; margin: 4mm 0 8mm; }
    .n1 .qr { width: 130mm; height: 130mm; } .n1 .say { font-size: 10mm; margin-top: 8mm; }
    .page.n8 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 5mm; }
    .n8 .item { border-width: 2mm; border-radius: 5mm; }
    .n8 .em { display: none; } .n8 h2 { font-size: 10mm; margin: 0 0 2mm; }
    .n8 .qr { width: 40mm; height: 40mm; } .n8 .say { font-size: 3.8mm; margin-top: 2mm; }
    .wrapper { overflow-x: auto; padding: 0 8px 16px; }

    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .wrapper { padding: 0; overflow: visible; }
      .page { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
      .page:last-child { break-after: auto; page-break-after: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1 style="margin:0">키워드 QR 인쇄용</h1>
    <p>QR 주소는 고정이에요. 한 번 출력해두면 행사 기간 내내 쓸 수 있어요. (A4 기준)</p>
    <button data-n="8" class="mode on">한 장에 모두 (7개)</button>
    <button data-n="1" class="mode">한 장에 1개 (크게)</button>
    <button class="print" onclick="print()">🖨️ 인쇄하기</button>
  </div>
  <div class="wrapper" id="pages"></div>
<script>
  const box = document.getElementById("pages");
  function render(per) {
    box.innerHTML = "";
    let page;
    KEYWORDS.forEach((k, i) => {
      if (i % per === 0) { page = document.createElement("div"); page.className = "page n" + per; box.appendChild(page); }
      const el = document.createElement("div");
      el.className = "item";
      el.style.setProperty("--c", k.color);
      el.innerHTML = `<div class="em">${k.emoji}</div><h2>${k.name}</h2><div class="qr"></div><div class="say">QR을 찍고 카드를 받으세요!</div>`;
      page.appendChild(el);
      new QRCode(el.querySelector(".qr"), { text: `${CARD_URL}?k=${k.id}`, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
    });
  }
  document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
    document.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x === b));
    render(+b.dataset.n);
  });
  render(8);
</script>
</body>
</html>
