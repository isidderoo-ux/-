<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>키워드 QR 인쇄</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="data.js"></script>
  <style>
    body { margin: 0; background: #f1f5f9; font-family: "Jua", system-ui, sans-serif; color: #1f2937; }
    .bar { padding: 16px; text-align: center; }
    .bar p { margin: 4px 0; font-family: system-ui, sans-serif; font-size: 14px; color: #475569; }
    .bar button { font-family: inherit; font-size: 18px; border: 0; border-radius: 999px; padding: 10px 24px; background: #f97316; color: #fff; cursor: pointer; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 16px; max-width: 1000px; margin: 0 auto; }
    .item { background: #fff; border-radius: 18px; padding: 18px; text-align: center; border: 6px solid var(--c); break-inside: avoid; page-break-inside: avoid; }
    .item h2 { margin: 0 0 4px; font-size: 44px; color: var(--c); }
    .item .em { font-size: 28px; }
    .qr { width: 180px; height: 180px; margin: 10px auto; }
    .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
    .item small { display: block; font-family: system-ui, sans-serif; font-size: 10px; color: #94a3b8; word-break: break-all; }
    .item .say { font-size: 16px; margin-top: 4px; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10mm; padding: 0; }
      .item { padding: 8mm; }
      .qr { width: 55mm; height: 55mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1 style="margin:0">키워드 QR 인쇄용</h1>
    <p>이 QR 주소는 고정이에요. 한 번 출력해두면 매일 써도 꿀팁만 날짜에 맞게 바뀝니다.</p>
    <p id="base"></p>
    <button onclick="print()">🖨️ 인쇄하기</button>
  </div>
  <div class="grid" id="grid"></div>
<script>
  // 카드 페이지 주소 (이 파일과 같은 폴더의 index.html)
  const base = CARD_URL;
  document.getElementById("base").textContent = "카드 주소: " + base + "?k=…";
  const grid = document.getElementById("grid");
  KEYWORDS.forEach(k => {
    const url = `${base}?k=${k.id}`;
    const el = document.createElement("div");
    el.className = "item";
    el.style.setProperty("--c", k.color);
    el.innerHTML = `<div class="em">${k.emoji}</div><h2>${k.name}</h2><div class="qr"></div><div class="say">QR을 찍고 카드를 받으세요!</div>`;
    grid.appendChild(el);
    new QRCode(el.querySelector(".qr"), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
  });
</script>
</body>
</html>
