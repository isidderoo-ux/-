<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>문구 미리보기</title>
  <script src="data.js"></script>
  <script src="daily/courage.js"></script><script src="daily/faith.js"></script><script src="daily/breakthrough.js"></script>
  <script src="daily/certainty.js"></script><script src="daily/love.js"></script><script src="daily/together.js"></script><script src="daily/skill.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #1f2937; }
    header { position: sticky; top: 0; background: #fff; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    header h1 { font-size: 18px; margin: 0 12px 0 0; }
    header button { border: 0; border-radius: 999px; padding: 6px 14px; color: #fff; font-size: 15px; cursor: pointer; opacity: .45; }
    header button.on { opacity: 1; }
    table { border-collapse: collapse; width: 100%; max-width: 1100px; margin: 0 auto; background: #fff; }
    td, th { border-bottom: 1px solid #e2e8f0; padding: 10px 12px; vertical-align: top; font-size: 14px; line-height: 1.6; text-align: left; }
    th { background: #f1f5f9; white-space: nowrap; }
    tr.today { background: #fef9c3; }
    td a { color: #2563eb; white-space: nowrap; }
  </style>
</head>
<body>
  <header><h1>날짜별 문구 미리보기</h1><span id="tabs"></span></header>
  <table><thead><tr><th>일차 / 날짜</th><th>말풍선 문구</th><th>실천 꿀팁</th></tr></thead><tbody id="rows"></tbody></table>
<script>
  const dn = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function show(id) {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
    const rows = DAILY[id].trim().split("\n");
    document.getElementById("rows").innerHTML = rows.map((r, i) => {
      const [q, t] = r.split(" ## ").map(x => esc(x).replace(/ \| /g, "<br>"));
      const date = new Date((dn(START_DATE) + i) * 86400000).toISOString().slice(0, 10);
      return `<tr class="${date === today ? "today" : ""}"><th>${i + 1}일차<br>${date.slice(5).replace("-", "/")}<br><a href="./?k=${id}&d=${date}" target="_blank">카드 보기</a></th><td>${q}</td><td>${t}</td></tr>`;
    }).join("");
  }
  document.getElementById("tabs").innerHTML = KEYWORDS.map(k => `<button data-id="${k.id}" style="background:${k.color}">${k.name}</button>`).join(" ");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.id));
  show(KEYWORDS[0].id);
</script>
</body>
</html>
