<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#fcd34d" />
  <title>오늘의 키워드</title>
  <meta name="description" content="룰렛을 돌리고 QR을 찍어 오늘의 키워드 카드를 받아보세요" />
  <meta property="og:title" content="오늘의 키워드 카드" />
  <meta property="og:description" content="룰렛을 돌리고 QR을 찍어 오늘의 키워드 카드를 받아보세요" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <script src="data.js?v=20261126a"></script>
  <script src="daily/courage.js?v=20261126a"></script>
  <script src="daily/faith.js?v=20261126a"></script>
  <script src="daily/breakthrough.js?v=20261126a"></script>
  <script src="daily/certainty.js?v=20261126a"></script>
  <script src="daily/victory.js?v=20261126a"></script>
  <script src="daily/together.js?v=20261126a"></script>
  <script src="daily/skill.js?v=20261126a"></script>
  <style>
    :root { --accent: #f97316; --frame: #fcd34d; --cream: #fffbea; --ink: #3b2a1a; --tip: #3f6212; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--frame);
      background-image: radial-gradient(circle at 20% 10%, #fde68a 0 30%, transparent 60%), radial-gradient(circle at 90% 90%, #fde68a 0 25%, transparent 60%);
      font-family: "Jua", "Gowun Dodum", system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh; min-height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px 14px calc(env(safe-area-inset-bottom) + 20px);
      -webkit-tap-highlight-color: transparent;
    }
    body { background-color: #fcd34d;
      background-image: radial-gradient(#fde68a 2px, transparent 2.5px), radial-gradient(circle at 50% 40%, #fde68a 0 35%, transparent 75%);
      background-size: 22px 22px, 100% 100%; }
    .wrap { width: 100%; max-width: 420px; }
    /* 카드 본체: 노란 테두리 + 크림색 속지 */
    .card {
      position: relative; width: 100%;
      background: var(--cream);
      border: 10px solid #fde68a; border-radius: 34px;
      box-shadow: 0 0 0 4px #fbbf24, 0 0 0 9px #fff7cc, 0 20px 40px rgba(146, 64, 14, .28);
      padding: 14px 14px 18px;
    }
    .corner { position: absolute; width: 38px; height: 38px; z-index: 2; }
    .corner.tl { top: -22px; left: -22px; } .corner.tr { top: -22px; right: -22px; }
    .corner.bl { bottom: -22px; left: -22px; } .corner.br { bottom: -22px; right: -22px; }

    /* 헤더 */
    .eyebrow { text-align: center; font-size: 22px; color: #1e3a5f; margin: 8px 0 4px; letter-spacing: 1px; }
    .eyebrow .ray { color: #f59e0b; }
    .cloud {
      position: relative; margin: 0 auto; width: 78%;
      background: var(--accent); color: #fff; text-align: center;
      font-size: clamp(56px, 17vw, 84px); line-height: 1.15; padding: 6px 0 12px;
      border-radius: 999px; border: 4px solid rgba(0,0,0,.12);
      box-shadow: 0 6px 0 rgba(0,0,0,.12), inset 0 -6px 0 rgba(0,0,0,.08);
      text-shadow: 0 3px 0 rgba(0,0,0,.15);
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; background: var(--accent); border-radius: 50%; z-index: -1;
      border: 4px solid rgba(0,0,0,.12);
    }
    .cloud::before { width: 34%; height: 70%; top: -22%; left: 16%; }
    .cloud::after  { width: 28%; height: 60%; top: -16%; right: 18%; }
    .cloud-wrap { position: relative; z-index: 0; padding-top: 14px; }
    .sparkle { position: absolute; top: 40%; font-size: 26px; color: #92400e; }
    .sparkle.l { left: 2%; } .sparkle.r { right: 2%; }

    /* 그림 */
    .scene {
      margin-top: 14px; border-radius: 26px; overflow: hidden; position: relative;
      aspect-ratio: 773 / 390; background: linear-gradient(#7cc4f5, #c9e9ff 70%, #d9f2c4);
      box-shadow: 0 4px 0 rgba(0,0,0,.08);
    }
    .scene img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fallback { position: absolute; inset: 0; }
    .fallback .sun { position: absolute; left: 10%; top: 18%; font-size: 64px; animation: float 3s ease-in-out infinite; }
    .fallback .hero { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); font-size: 96px; animation: bounce 1.8s ease-in-out infinite; }
    .fallback .hill { position: absolute; bottom: -40%; left: -10%; right: -10%; height: 70%; background: #86c56b; border-radius: 50%; }
    .fallback .flag {
      position: absolute; right: 10%; top: 14%; background: #fff; color: #1e3a5f; font-size: 26px;
      padding: 6px 16px; border-radius: 8px; border-left: 6px solid #8b5e34; transform: rotate(-6deg);
      box-shadow: 0 3px 0 rgba(0,0,0,.1);
    }
    .fallback .cl { position: absolute; color: #fff; font-size: 40px; opacity: .9; }
    @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(8deg); } }

    /* 말씀 박스 */
    .quote {
      margin-top: -18px; position: relative; background: #fff; border-radius: 28px;
      padding: 26px 22px 20px; text-align: center; font-size: 17px; line-height: 1.7; word-break: keep-all;
      box-shadow: 0 4px 0 rgba(0,0,0,.06);
    }
    .quote .q { position: absolute; font-size: 54px; color: #f59e0b; line-height: 1; font-family: Georgia, serif; }
    .quote .q.open { left: 12px; top: 10px; } .quote .q.close { right: 14px; bottom: -6px; }
    .hl { color: var(--accent); font-size: 1.35em; background: linear-gradient(transparent 60%, #fde68a 60%); padding: 0 2px; }

    /* 실천 꿀팁 */
    .tip-head { display: flex; justify-content: center; margin-top: 18px; position: relative; z-index: 1; }
    .tip-head span {
      background: #4d7c0f; color: #fff; font-size: 21px; padding: 6px 20px 6px 14px; border-radius: 999px;
      box-shadow: 0 3px 0 rgba(0,0,0,.12);
    }
    .tip {
      margin-top: -14px; background: #f7fee7; border: 3px solid #bef264; border-radius: 28px;
      padding: 28px 18px 18px; text-align: center; color: var(--tip); font-size: 18px; line-height: 1.65; word-break: keep-all;
    }
    .tip mark { background: linear-gradient(transparent 55%, #fed7aa 55%); color: #ea580c; padding: 0 2px; }
    .date { margin-top: 10px; font-family: "Gowun Dodum", sans-serif; font-size: 13px; color: #65a30d; }

    .foot { text-align: center; margin-top: 16px; font-family: "Gowun Dodum", sans-serif; font-size: 13px; color: #92400e; }
    .actions { display: flex; gap: 8px; justify-content: center; margin-top: 28px; }
    .actions button {
      font-family: inherit; font-size: 16px; border: 0; border-radius: 999px; padding: 10px 18px;
      background: #fff; color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.12); cursor: pointer;
    }

    /* 완성 카드 그림 모드 */
    .img-card img { display: block; width: 100%; height: auto; border-radius: 22px; box-shadow: 0 14px 30px rgba(146, 64, 14, .28); }
    .tipcard {
      position: relative; margin-top: 26px; background: #fffbea; border: 8px solid #fedc50; border-radius: 26px;
      box-shadow: 0 10px 24px rgba(146, 64, 14, .2); padding: 30px 16px 16px;
    }
    .tipcard .tip-head { position: absolute; left: 0; right: 0; top: -20px; margin: 0; }
    .tipcard .tip { margin: 0; border: 0; background: transparent; padding: 0; }

    /* 등장 애니메이션 */
    .reveal { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
    .reveal.d1 { animation-delay: .1s; } .reveal.d2 { animation-delay: .35s; } .reveal.d3 { animation-delay: .6s; } .reveal.d4 { animation-delay: .85s; }
    @keyframes pop { from { opacity: 0; transform: scale(.85) translateY(16px); } to { opacity: 1; transform: none; } }

    /* 키워드 목록(파라미터 없을 때) */
    .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; }
    .list a {
      display: block; text-align: center; text-decoration: none; color: #fff; font-size: 26px;
      padding: 18px 8px; border-radius: 20px; box-shadow: 0 4px 0 rgba(0,0,0,.12);
    }
    .list a small { display: block; font-size: 30px; }
  </style>
</head>
<body>
  <main class="wrap" id="app"></main>

<script>
  // 한국 시간 기준 오늘 날짜 (YYYY-MM-DD)
  function todayKST() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }
  function dayNumber(ymd) {
    const [y, m, d] = ymd.split("-").map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  }
  function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  // *단어* → 키워드 강조,  '단어' → 형광펜,  줄바꿈 → <br>
  function fmtQuote(s) { return esc(s).replace(/\*(.+?)\*/g, '<span class="hl">$1</span>').replace(/\n/g, "<br>"); }
  function fmtTip(s) { return esc(s).replace(/'(.+?)'/g, "<mark>‘$1’</mark>").replace(/\n/g, "<br>"); }

  // 기기마다 익명 ID 하나 (폰에 저장). 문구 배정과 조회 기록에 사용
  function getDevice() {
    let device = null;
    try { device = localStorage.getItem("card.device"); } catch (e) {}
    if (!/^D-[0-9A-Z]{8}$/.test(device || "")) {
      const abc = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
      device = "D-" + Array.from(crypto.getRandomValues(new Uint8Array(8)), b => abc[b % abc.length]).join("");
      try { localStorage.setItem("card.device", device); } catch (e) {}
    }
    return device;
  }
  function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return h >>> 0; }

  // 조회 기록: 기기마다 익명 ID 하나, 같은 날 같은 키워드는 한 번만 전송
  function logView(kw) {
    if (!LOG_URL || params.has("d") || !/^https:/.test(location.protocol)) return; // 미리보기·로컬 테스트는 제외
    try {
      const device = getDevice();
      const sentKey = "card.sent." + ymd + "." + kw.id;
      if (localStorage.getItem(sentKey)) return;
      let pass = null;   // 출석 체크 출입증이 이 폰에 저장돼 있으면 이름(가림 처리)도 함께
      try { pass = JSON.parse(localStorage.getItem("qrPass.v1")); } catch (e) {}
      const now = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Seoul", dateStyle: "short", timeStyle: "medium" }).format(new Date());
      fetch(LOG_URL, {
        method: "POST", mode: "no-cors", keepalive: true,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "card", kw: kw.name, device, uid: pass && pass.uniqueId || "", name: pass && pass.maskedName || "", time: now }),
      }).then(() => localStorage.setItem(sentKey, "1")).catch(() => {});
    } catch (e) {}
  }

  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const kw = KEYWORDS.find(k => k.id === (params.get("k") || "").toLowerCase());
  // ?d=2026-12-01 로 다른 날짜의 꿀팁 미리보기 가능
  const ymd = /^\d{4}-\d{2}-\d{2}$/.test(params.get("d") || "") ? params.get("d") : todayKST();

  if (!kw) {
    document.title = "오늘의 키워드";
    app.innerHTML = `
      <div class="eyebrow reveal">오늘의 키워드</div>
      <p class="foot reveal d1" style="font-size:16px">룰렛을 돌리고 나온 키워드의 QR을 찍어주세요!</p>
      <div class="list">
        ${KEYWORDS.map((k, i) => `<a class="reveal d${Math.min(i, 4)}" style="background:${k.color}" href="?k=${k.id}"><small>${k.emoji}</small>${k.name}</a>`).join("")}
      </div>`;
  } else {
    document.title = `오늘의 키워드 · ${kw.name}`;
    document.documentElement.style.setProperty("--accent", kw.color);
    // 날짜별 문구: START_DATE 가 1일차, 하루에 한 줄씩
    const rows = (DAILY[kw.id] || "").trim().split("\n").map(r => (r.includes(" ## ") ? r.split(" ## ") : ["", r]).map(x => x.replace(/ \| /g, "\n")));   // 꿀팁만 있는 줄은 말풍선 비움
    let idx = dayNumber(ymd) - dayNumber(START_DATE);
    if (idx < 0) idx = 0;                                  // 행사 전 → 1일차
    if (idx > EVENT_DAYS - 1) idx = EVENT_DAYS - 1;        // 행사 후 → 마지막 날
    const dayNo = idx + 1;
    // 꿀팁 고르기
    //  · 사람(폰)마다 키워드별로 꿀팁 순서를 따로 섞어 두고, 카드를 열 때마다 다음 꿀팁으로 넘어감
    //    → 같은 사람이 같은 키워드를 여러 번 뽑아도 매번 다른 꿀팁 (55개를 다 볼 때까지 안 겹침)
    //  · 같은 창에서 새로고침하면 방금 본 꿀팁 그대로
    //  · 성탄·연말·마지막 날(32~36일차)은 그날 처음 열 때 모두에게 같은 시즌 꿀팁
    const FIXED_FROM = EVENT_DAYS;   // 시즌 고정 메시지 없음 (모든 메시지를 섞어서 사용)
    const pool = rows.filter((_, i) => i < FIXED_FROM || i >= EVENT_DAYS);
    const preview = params.has("d") || params.has("v");   // 미리보기 주소는 순서를 넘기지 않음
    const dev = params.get("v") || getDevice();
    const order = pool.map((_, i) => i);                  // 기기·키워드별로 고정된 섞인 순서
    let seed = hash(dev + kw.id);
    for (let i = order.length - 1; i > 0; i--) {
      seed = hash(seed + ":" + i);
      const j = seed % (i + 1);
      [order[i], order[j]] = [order[j], order[i]];
    }
    const store = {
      get(k, ss) { try { return (ss ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },
      set(k, v, ss) { try { (ss ? sessionStorage : localStorage).setItem(k, v); } catch (e) {} },
    };
    let quote, tip;
    const curKey = "card.cur." + kw.id + "." + ymd;
    const seasonKey = "card.season." + kw.id + "." + ymd;
    if (preview) {
      [quote, tip] = idx >= FIXED_FROM ? rows[idx] : pool[order[idx % order.length]];
    } else if (store.get(curKey, true)) {                   // 새로고침 → 같은 꿀팁
      const c = store.get(curKey, true);
      [quote, tip] = c === "season" ? rows[idx] : pool[order[(+c) % order.length]];
    } else if (idx >= FIXED_FROM && !store.get(seasonKey)) { // 시즌 날 첫 카드
      [quote, tip] = rows[idx];
      store.set(seasonKey, "1");
      store.set(curKey, "season", true);
    } else {
      const n = parseInt(store.get("card.n." + kw.id) || "0", 10) || 0;
      [quote, tip] = pool[order[n % order.length]];
      store.set("card.n." + kw.id, String(n + 1));
      store.set(curKey, String(n), true);
    }
    const [y, m, d] = ymd.split("-").map(Number);
    const wd = "일월화수목금토"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];

    const dateLine = `${m}월 ${d}일 (${wd}) · ${dayNo < EVENT_DAYS ? `${dayNo}일차 · 찍을 때마다 새 꿀팁` : "마지막 날 · 함께해 주셔서 감사해요!"}`;
    const tail = `
      <div class="actions reveal d4">
        <button id="share">📤 카드 공유하기</button>
      </div>
      <div class="foot">${esc(CHURCH_NAME)} 🙌 내일도 룰렛 돌리러 오세요!</div>`;

    if (kw.card) {
      // 완성 카드 그림 + 오늘의 실천 꿀팁
      app.innerHTML = `
      <div class="img-card reveal"><img src="${kw.card}" alt="오늘의 키워드 ${esc(kw.name)}"></div>
      ${SHOW_TIPS ? `<section class="tipcard reveal d2">
        <div class="tip-head"><span>💡 오늘의 실천 꿀팁</span></div>
        <div class="tip">${fmtTip(tip)}<div class="date">${dateLine}</div></div>
      </section>` : ""}` + tail;
    } else app.innerHTML = `
      <section class="card">
      ${["tl", "tr", "bl", "br"].map(c => `<svg class="corner ${c}" viewBox="0 0 40 40"><g fill="#fb923c"><circle cx="20" cy="10" r="9"/><circle cx="20" cy="30" r="9"/><circle cx="10" cy="20" r="9"/><circle cx="30" cy="20" r="9"/></g><circle cx="20" cy="20" r="6" fill="#fed7aa"/></svg>`).join("")}
      <div class="eyebrow reveal"><span class="ray">╲</span> 오늘의 키워드 <span class="ray">╱</span></div>
      <div class="cloud-wrap reveal d1">
        <span class="sparkle l">✦</span><span class="sparkle r">✦</span>
        <div class="cloud">${esc(kw.name)}</div>
      </div>
      <div class="scene reveal d2" id="scene">
        <div class="fallback">
          <span class="cl" style="left:30%;top:6%">☁</span><span class="cl" style="right:4%;top:48%">☁</span>
          <div class="hill"></div>
          <span class="sun">🌞</span>
          <span class="flag">${esc(kw.flag)}</span>
          <span class="hero">${kw.emoji}</span>
        </div>
      </div>
      <div class="quote reveal d3">
        <span class="q open">“</span>${fmtQuote(quote)}<span class="q close">”</span>
      </div>
      <div class="tip-head reveal d4"><span>💡 오늘의 실천 꿀팁</span></div>
      <div class="tip reveal d4">
        ${fmtTip(tip)}
        <div class="date">${dateLine}</div>
      </div>
      </section>` + tail;

    logView(kw);

    // 그림 파일이 있으면 이모지 그림 대신 표시
    if (!kw.card && kw.image) {
      const img = new Image();
      img.alt = kw.name;
      img.onload = () => { const s = document.getElementById("scene"); s.innerHTML = ""; s.appendChild(img); };
      img.src = kw.image;
    }

    document.getElementById("share").onclick = async () => {
      const data = { title: `오늘의 키워드: ${kw.name}`, text: `오늘의 키워드는 '${kw.name}'!` + (SHOW_TIPS ? `\n${tip.replace(/'/g, "")}` : ""), url: location.href.split("&d=")[0] };
      try {
        if (navigator.share) await navigator.share(data);
        else { await navigator.clipboard.writeText(`${data.text}\n${data.url}`); alert("링크가 복사되었어요!"); }
      } catch (e) {}
    };
  }
</script>
</body>
</html>
