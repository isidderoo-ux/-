<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에어컨 요청</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1d22;
    --muted: #6b7280;
    --border: #dfe2e7;
    --accent: #2f6fed;
    --accent-soft: #e6eefe;
    --cold: #2a7de1;
    --cold-soft: #e3f0fd;
    --hot: #e5484d;
    --hot-soft: #fdecec;
    --ok: #1f9d55;
    --err: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --card: #1c1f25;
      --text: #eceef2;
      --muted: #9aa1ad;
      --border: #2e333c;
      --accent: #6b9bff;
      --accent-soft: #1f2b45;
      --cold: #5aa2ff;
      --cold-soft: #18283d;
      --hot: #ff6b6f;
      --hot-soft: #3a1d20;
      --ok: #4cc283;
      --err: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  h1 { font-size: 22px; margin: 4px 0 20px; }
  h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 10px;
  }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .extras { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .zone {
    min-height: 56px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .zone[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .action {
    min-height: 110px;
    border-radius: 14px;
    border: 2px solid transparent;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .action .emoji { font-size: 36px; line-height: 1; }
  .action.cold { background: var(--cold-soft); color: var(--cold); border-color: var(--cold); }
  .action.hot { background: var(--hot-soft); color: var(--hot); border-color: var(--hot); }
  .action:disabled { opacity: .4; cursor: not-allowed; }
  input[type="text"] {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  #status {
    min-height: 22px;
    margin-top: 6px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1 id="title">에어컨 요청</h1>

  <section>
    <h2>1. 지금 계신 곳</h2>
    <div class="grid" id="grid"></div>
    <div class="grid extras" id="extras"></div>
  </section>

  <section>
    <h2>2. 어떠세요?</h2>
    <div class="actions">
      <button class="action cold" data-type="cold" disabled><span class="emoji">🥶</span>추워요</button>
      <button class="action hot" data-type="hot" disabled><span class="emoji">🥵</span>더워요</button>
    </div>
    <input type="text" id="note" maxlength="100" placeholder="메모 (선택) 예: 바람이 직접 와요">
    <p class="hint" id="hint">먼저 위치를 선택해 주세요.</p>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
  const gridEl = document.getElementById('grid');
  const extrasEl = document.getElementById('extras');
  const actionBtns = document.querySelectorAll('.action');
  const noteEl = document.getElementById('note');
  const hintEl = document.getElementById('hint');
  const statusEl = document.getElementById('status');
  let zones = [];
  let selectedId = null;

  function storage(action, value) {
    try {
      if (action === 'get') return localStorage.getItem('ac-zone');
      localStorage.setItem('ac-zone', value);
    } catch { return null; }
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function select(id) {
    selectedId = id;
    document.querySelectorAll('.zone').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
    actionBtns.forEach((b) => { b.disabled = false; });
    const zone = zones.find((z) => z.id === id);
    hintEl.textContent = `${zone.name}에서 요청합니다.`;
    storage('set', id);
  }

  function renderZones() {
    for (const zone of zones) {
      const btn = document.createElement('button');
      btn.className = 'zone';
      btn.dataset.id = zone.id;
      btn.textContent = zone.name;
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', () => select(zone.id));
      (zone.group === 'extra' ? extrasEl : gridEl).appendChild(btn);
    }
  }

  async function send(type) {
    if (!selectedId) return;
    actionBtns.forEach((b) => { b.disabled = true; });
    setStatus('전송 중…');
    try {
      const res = await fetch('/api/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zoneId: selectedId, type, note: noteEl.value }),
      });
      const data = await res.json();
      setStatus(data.message, data.ok ? 'ok' : 'err');
      if (data.ok) noteEl.value = '';
    } catch {
      setStatus('네트워크 오류가 발생했어요. 다시 시도해 주세요.', 'err');
    } finally {
      actionBtns.forEach((b) => { b.disabled = false; });
    }
  }

  actionBtns.forEach((b) => b.addEventListener('click', () => send(b.dataset.type)));

  (async () => {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    zones = cfg.zones;
    document.title = cfg.title;
    document.getElementById('title').textContent = cfg.title;
    renderZones();

    // QR 코드 등으로 ?zone=Z3 처럼 들어오면 해당 위치를 자동 선택
    const fromUrl = new URLSearchParams(location.search).get('zone');
    const initial = [fromUrl, storage('get')].find((id) => id && zones.some((z) => z.id === id));
    if (initial) select(initial);
  })();
</script>
</body>
</html>
