    body { -webkit-tap-highlight-color: transparent; }

    #qrcode img, #qrcode canvas { width: 100% !important; height: auto !important; image-rendering: pixelated; }
    #reader { border: none !important; }
    #reader video { border-radius: 1rem; object-fit: cover; }

<script>
  // ===================== 설정 상수 =====================
  const ADMIN_PIN = "0000";
  // 선택 사항: 비워두면 태블릿에만 저장(CSV로 내려받기). 넣으면 구글 시트에도 백업 전송
  const GOOGLE_SCRIPT_URL = "";
  const DEFAULT_CAMERA = "user";    // "user" = 전면(거치대에 세운 태블릿), "environment" = 후면
  const SCAN_COOLDOWN_MS = 5000;    // 동일 ID 재스캔 무시 시간
  const QR_REFRESH_SEC = 15;        // QR 타임스탬프 갱신 주기
  const QR_MAX_AGE_MIN = 30;        // 스캔 시 허용하는 QR 유효 시간(분). 캡처 화면 재사용 방지
  const STORAGE_KEY = "qrPass.v1";
  const LOG_KEY = "qrPass.scanLog.v1";
  const CAMERA_KEY = "qrPass.camera.v1";
</script>

  <!-- 하단 탭 바 -->

        내 출입증

<script>
// =====================================================================
// 공통 유틸
// =====================================================================
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");

function safeGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function safeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function safeRemove(key) {
  try { localStorage.removeItem(key); } catch {}
}

function formatTime(d) {
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function formatDateTime(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${formatTime(d)}`;
}

/** 이름 마스킹: 2글자 → 홍*, 3글자 이상 → 첫/끝 글자만 남기고 중간 * */
function maskName(name) {
  const chars = Array.from(name.trim()); // 유니코드 안전
  if (chars.length <= 1) return chars.join("");
  if (chars.length === 2) return chars[0] + "*";
  return chars[0] + "*".repeat(chars.length - 2) + chars[chars.length - 1];
}

/** SHA-256(이름+생년월일+비밀번호) → 앞 6자리 대문자 → U-XXXXXX */
async function makeUniqueId(name, birth, pw) {
  if (!window.crypto || !crypto.subtle) {
    throw new Error("보안 연결(HTTPS)에서만 출입증을 발급할 수 있습니다.");
  }
  const bytes = new TextEncoder().encode(name.trim() + birth + pw);
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  const hex = Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, "0")).join("");
  return "U-" + hex.slice(0, 6).toUpperCase();
}

// =====================================================================
// 탭 전환
// =====================================================================
let currentTab = "user";

function switchTab(tab) {
  currentTab = tab;
  $("tab-user").classList.toggle("hidden", tab !== "user");
  $("tab-admin").classList.toggle("hidden", tab !== "admin");
  $("pageTitle").textContent = tab === "user" ? "내 출입증" : "QR 스캐너";
  $("appShell").classList.toggle("max-w-md", tab !== "admin");
  $("appShell").classList.toggle("max-w-5xl", tab === "admin");
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    const active = btn.dataset.tab === tab;
    btn.classList.toggle("text-indigo-600", active);
    btn.classList.toggle("text-slate-400", !active);
  });

  if (tab === "admin") {
    if (adminUnlocked) startScanner();
  } else {
    stopScanner();
  }
}

document.querySelectorAll(".tab-btn").forEach((btn) =>
  btn.addEventListener("click", () => switchTab(btn.dataset.tab))
);

// =====================================================================
// 참석자: 로그인 / 출입증
// =====================================================================
let pass = null;          // { uniqueId, maskedName }
let qrInstance = null;
let qrTimer = null;
let clockTimer = null;
let qrRemain = QR_REFRESH_SEC;

function showLogin() {
  pass = null;
  stopPassTimers();
  $("passCard").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
  $("loginForm").reset();
  $("inRemember").checked = true;
}

function showPass(p, persisted) {
  pass = p;
  $("loginCard").classList.add("hidden");
  $("passCard").classList.remove("hidden");
  $("passName").textContent = p.maskedName;
  $("passId").textContent = "#" + p.uniqueId;
  $("memoryNotice").classList.toggle("hidden", persisted);
  renderQR();
  startPassTimers();
}

function renderQR() {
  if (!pass) return;
  const payload = JSON.stringify({ id: pass.uniqueId, name: pass.maskedName, ts: Date.now() });
  const el = $("qrcode");
  el.innerHTML = "";
  qrInstance = new QRCode(el, {
    text: payload,
    width: 512,
    height: 512,
    colorDark: "#0f172a",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M,
  });
  qrRemain = QR_REFRESH_SEC;
  updateQrProgress();
}

function updateQrProgress() {
  $("qrCountdown").textContent = qrRemain;
  $("qrProgress").style.width = (qrRemain / QR_REFRESH_SEC) * 100 + "%";
}

function tickClock() {
  const now = new Date();
  $("clock").textContent = formatTime(now);
  $("clockDate").textContent = now.toLocaleDateString("ko-KR", {
    year: "numeric", month: "long", day: "numeric", weekday: "short",
  });
}

function startPassTimers() {
  stopPassTimers();
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
  qrTimer = setInterval(() => {
    qrRemain -= 1;
    if (qrRemain <= 0) renderQR();
    else updateQrProgress();
  }, 1000);
}

function stopPassTimers() {
  clearInterval(clockTimer);
  clearInterval(qrTimer);
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("loginError");
  err.classList.add("hidden");

  const name = $("inName").value.trim();
  const birth = $("inBirth").value.trim();
  const pw = $("inPw").value.trim();

  let msg = "";
  if (Array.from(name).length < 2) msg = "이름을 2글자 이상 입력해주세요.";
  else if (!/^\d{6}$/.test(birth)) msg = "생년월일은 숫자 6자리로 입력해주세요. (예: 900101)";
  else if (!/^\d{4}$/.test(pw)) msg = "비밀번호는 숫자 4자리로 입력해주세요.";
  if (msg) {
    err.textContent = msg;
    err.classList.remove("hidden");
    return;
  }

  try {
    const uniqueId = await makeUniqueId(name, birth, pw);
    const p = { uniqueId, maskedName: maskName(name) };
    // 원본 이름·생년월일·비밀번호는 저장하지 않음
    const remember = $("inRemember").checked;
    if (remember) safeSet(STORAGE_KEY, p);
    else safeRemove(STORAGE_KEY);
    $("loginForm").reset();
    showPass(p, remember);
  } catch (ex) {
    err.textContent = ex.message || "출입증 발급에 실패했습니다.";
    err.classList.remove("hidden");
  }
});

// 숫자 입력칸은 숫자만 허용
["inBirth", "inPw", "inPin"].forEach((id) =>
  $(id).addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); })
);

$("logoutBtn").addEventListener("click", () => {
  if (!confirm("저장된 출입증 정보를 삭제하고 로그아웃할까요?")) return;
  safeRemove(STORAGE_KEY);
  showLogin();
});

// =====================================================================
// 관리자: PIN / 스캐너
// =====================================================================
let adminUnlocked = false;
let scanner = null;
let scannerRunning = false;
let scannerBusy = false;
const lastScanAt = new Map();   // id → timestamp (쿨타임)
let scanLog = safeGet(LOG_KEY) || [];
let audioCtx = null;
let facing = safeGet(CAMERA_KEY) || DEFAULT_CAMERA;
let wakeLock = null;

/** 스캔 중에는 태블릿 화면이 꺼지지 않도록 유지 */
async function keepAwake(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch {}
}

function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch {}
}

/** '띠링' 2음 비프 */
function playBeep() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [[1318.5, 0], [1760, 0.12]].forEach(([freq, offset]) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0 + offset);
    gain.gain.exponentialRampToValueAtTime(0.35, t0 + offset + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.25);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + offset);
    osc.stop(t0 + offset + 0.3);
  });
  if (navigator.vibrate) navigator.vibrate(80);
}

$("pinForm").addEventListener("submit", (e) => {
  e.preventDefault();
  unlockAudio(); // 사용자 제스처 안에서 오디오 활성화
  if ($("inPin").value === ADMIN_PIN) {
    adminUnlocked = true;
    $("pinError").classList.add("hidden");
    $("inPin").value = "";
    $("pinCard").classList.add("hidden");
    $("scannerCard").classList.remove("hidden");
    renderLog();
    startScanner();
  } else {
    $("pinError").classList.remove("hidden");
    $("inPin").value = "";
  }
});

$("adminLockBtn").addEventListener("click", async () => {
  await stopScanner();
  adminUnlocked = false;
  $("scannerCard").classList.add("hidden");
  $("pinCard").classList.remove("hidden");
});

$("camToggleBtn").addEventListener("click", () => {
  scannerRunning ? stopScanner() : startScanner();
});

$("camFlipBtn").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  safeSet(CAMERA_KEY, facing);
  await stopScanner();
  startScanner();
});

$("fullscreenBtn").addEventListener("click", () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen?.();
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
});

function setCamStatus(on, text) {
  $("camStatus").innerHTML =
    `<span class="w-2 h-2 rounded-full ${on ? "bg-emerald-500 pulse" : "bg-slate-300"}"></span> ${text}`;
  $("camToggleBtn").textContent = on ? "카메라 중지" : "카메라 시작";
}

async function startScanner() {
  if (scannerRunning || scannerBusy || currentTab !== "admin" || !adminUnlocked) return;
  scannerBusy = true;
  $("camError").classList.add("hidden");
  setCamStatus(false, "연결 중…");
  try {
    if (!scanner) scanner = new Html5Qrcode("reader", { verbose: false });
    await scanner.start(
      { facingMode: facing },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      onScanSuccess,
      () => {} // 프레임별 인식 실패는 무시
    );
    scannerRunning = true;
    $("reader").classList.toggle("mirror", facing === "user");
    setCamStatus(true, facing === "user" ? "스캔 중 · 전면" : "스캔 중 · 후면");
    keepAwake(true);
  } catch (err) {
    setCamStatus(false, "중지됨");
    $("camError").textContent = "카메라를 열 수 없습니다. 브라우저 카메라 권한과 HTTPS 접속 여부를 확인해주세요.";
    $("camError").classList.remove("hidden");
    console.error(err);
  } finally {
    scannerBusy = false;
  }
}

async function stopScanner() {
  if (!scanner || !scannerRunning) return;
  try { await scanner.stop(); } catch {}
  scannerRunning = false;
  setCamStatus(false, "중지됨");
  keepAwake(false);
}

function parsePayload(text) {
  try {
    const d = JSON.parse(text);
    if (d && typeof d.id === "string" && /^U-[0-9A-F]{6}$/.test(d.id) && typeof d.name === "string") {
      return { id: d.id, name: d.name.slice(0, 30), ts: Number(d.ts) || null };
    }
  } catch {}
  return null;
}

function onScanSuccess(decodedText) {
  const data = parsePayload(decodedText);
  if (!data) {
    showBanner("error", "유효하지 않은 출입증 QR입니다.");
    return;
  }

  // 오래된 QR(캡처 화면 등) 거부. 기기 간 시계 오차를 고려해 미래 시각은 1분까지 허용
  const age = Date.now() - (data.ts || 0);
  if (!data.ts || age > QR_MAX_AGE_MIN * 60000 || age < -60000) {
    showBanner("error", "만료된 QR입니다. 출입증 화면을 새로 열어주세요.");
    return;
  }

  // 동일 ID 5초 쿨타임
  const now = Date.now();
  const last = lastScanAt.get(data.id);
  if (last && now - last < SCAN_COOLDOWN_MS) return;
  lastScanAt.set(data.id, now);

  const time = formatDateTime(new Date(now));

  // 같은 날 이미 출석한 ID는 다시 기록하지 않음
  const already = scanLog.find((r) => r.id === data.id && r.time.startsWith(todayStr()));
  if (already) {
    showBanner("info", `${data.name} (#${data.id})님은 이미 출석했습니다 (${already.time.split(" ")[1]})`);
    return;
  }

  playBeep();
  showBanner("success", `${data.name} (#${data.id})님 출석 완료!`);

  scanLog.unshift({ id: data.id, name: data.name, time });
  safeSet(LOG_KEY, scanLog);
  renderLog();

  sendToSheet({ id: data.id, name: data.name, time });
}

function sendToSheet(record) {
  if (!GOOGLE_SCRIPT_URL) return; // 태블릿 단독 운영
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(record),
  }).catch((err) => {
    console.error(err);
    showBanner("error", "시트 전송 실패 — 네트워크를 확인해주세요.");
  });
}

function renderLog() {
  const list = $("logList");
  list.innerHTML = "";
  scanLog.forEach((r) => {
    const li = document.createElement("li");
    li.className = "flex items-center justify-between py-3";

    const left = document.createElement("div");
    const nm = document.createElement("p");
    nm.className = "font-semibold";
    nm.textContent = r.name;
    const id = document.createElement("p");
    id.className = "font-mono text-xs text-slate-400";
    id.textContent = "#" + r.id;
    left.append(nm, id);

    const tm = document.createElement("span");
    tm.className = "font-mono text-sm text-slate-500 tabular-nums";
    tm.textContent = r.time.split(" ")[1] || r.time;
    tm.title = r.time;

    li.append(left, tm);
    list.appendChild(li);
  });
  $("logCount").textContent = scanLog.length;
  $("todayCount").textContent = scanLog.filter((r) => r.time.startsWith(todayStr())).length;
  $("logEmpty").classList.toggle("hidden", scanLog.length > 0);
}

function todayStr() {
  return formatDateTime(new Date()).split(" ")[0];
}

/** 엑셀에서 한글이 깨지지 않도록 BOM 포함 CSV로 저장 */
function exportCsv() {
  if (!scanLog.length) {
    showBanner("info", "내려받을 출석 기록이 없습니다.");
    return;
  }
  const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [["날짜", "시간", "고유ID", "이름"]].concat(
    scanLog.slice().reverse().map((r) => { const [d, t] = r.time.split(" "); return [d, t, r.id, r.name]; })
  );
  const csv = "\uFEFF" + rows.map((row) => row.map(esc).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `attendance_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$("exportBtn").addEventListener("click", exportCsv);

$("clearLogBtn").addEventListener("click", () => {
  if (!confirm("이 태블릿의 출석 기록을 모두 지울까요? 먼저 CSV로 내려받았는지 확인하세요.")) return;
  scanLog = [];
  safeRemove(LOG_KEY);
  renderLog();
});

// =====================================================================
// 알림 배너
// =====================================================================
let bannerTimer = null;
function showBanner(type, message) {
  const b = $("banner");
  const style = {
    success: ["bg-emerald-600", "✅"],
    info: ["bg-amber-500", "ℹ️"],
    error: ["bg-rose-600", "⚠️"],
  }[type] || ["bg-rose-600", "⚠️"];
  b.innerHTML = "";
  const box = document.createElement("div");
  box.className = `banner-in flex items-center gap-3 rounded-2xl px-4 py-3.5 md:px-6 md:py-5 shadow-xl text-white ${style[0]}`;
  const icon = document.createElement("span");
  icon.className = "text-xl md:text-3xl";
  icon.textContent = style[1];
  const txt = document.createElement("p");
  txt.className = "font-semibold md:text-2xl";
  txt.textContent = message;
  box.append(icon, txt);
  b.appendChild(box);
  b.classList.remove("hidden");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.add("hidden"), 2500);
}

// 백그라운드 전환 시 카메라 해제, 복귀 시 재시작
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopScanner(); // 화면 잠금 유지(wakeLock)도 함께 해제됨
  else if (currentTab === "admin" && adminUnlocked) startScanner();
});

// =====================================================================
// 초기화: 저장된 출입증이 있으면 바로 QR 카드 표시
// =====================================================================
(function init() {
  const saved = safeGet(STORAGE_KEY);
  if (saved && /^U-[0-9A-F]{6}$/.test(saved.uniqueId) && typeof saved.maskedName === "string") {
    showPass(saved, true);
  } else {
    showLogin();
  }
  switchTab("user");
})();
</script>
